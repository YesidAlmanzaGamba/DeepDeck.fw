[package]
name = "deepdeck-command-center"
version = "0.1.0"
edition = "2021"
description = "DeepDeck Command Center: configure the DeepDeck over BLE or USB"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"
rfd = "0.15"
sha2 = "0.10"
base64 = "0.22"

# BLE on macOS and Linux (R4.4); Windows uses its own WinRT module (ble_win.rs, D-015)
[target.'cfg(not(windows))'.dependencies]
btleplug = "0.11"
futures = "0.3"
tokio = { version = "1", features = ["time"] }
uuid = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Devices_Bluetooth",
    "Devices_Bluetooth_GenericAttributeProfile",
    "Devices_Enumeration",
    "Foundation",
    "Foundation_Collections",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
windows-future = "0.2"

[profile.release]
strip = true
lto = true
