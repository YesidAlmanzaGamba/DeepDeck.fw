<header class="bar">
  <button mat-icon-button (click)="toggleSideNav()" title="Show or hide the menu labels">
    <mat-icon>menu</mat-icon>
  </button>
  <img class="logo" src="assets/logo/logo.png" alt="DeepDeck">
  <span class="spacer"></span>
  <a class="link" [routerLink]="['/connect']" [class.ok]="status.connected" [title]="status.connected ? 'Connected' : (status.reason || 'Not connected')">
    <mat-icon>{{ status.connected ? (status.kind === 'usb' ? 'usb' : 'bluetooth_connected') : 'link_off' }}</mat-icon>
    <span class="text">{{ status.connected ? status.name : 'Not connected' }}</span>
  </a>
</header>
