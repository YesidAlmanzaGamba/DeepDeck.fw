<!-- App shell: header on top, then the menu and the page side by side; only the page scrolls -->
<div class="shell">
  <app-header class="shell-header"></app-header>
  <div class="shell-body">
    <nav class="shell-nav" [class.collapsed]="!stateBar">
      <app-sidenav></app-sidenav>
    </nav>
    <main class="shell-main">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
