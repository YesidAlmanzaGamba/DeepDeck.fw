# Builds the firmware and the Command Center on every push and pull request (R6.6).
# A tag "v*" also publishes a GitHub release with the installer and the firmware image.
name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    name: Firmware (ESP-IDF 4.4.7)
    runs-on: ubuntu-latest
    container: espressif/idf:v4.4.7
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py -C firmware build
      - name: Collect the images
        shell: bash
        run: |
          mkdir -p out/firmware
          cd firmware/build
          cp DeepDeck.bin bootloader/bootloader.bin partition_table/partition-table.bin ota_data_initial.bin flash_args ../../out/firmware/
          ls -l ../../out/firmware
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: out/firmware

  app-windows:
    name: Command Center (Windows installer)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web/src-tauri
      - run: npm ci --no-audit --no-fund
      # the Tauri CLI is pinned here, not in package.json (D-026); it runs `npm run build-prod` first
      - run: npx --yes @tauri-apps/cli@2.12.3 build
      - uses: actions/upload-artifact@v4
        with:
          name: command-center-windows
          path: web/src-tauri/target/release/bundle/nsis/*.exe

  app-check:
    name: Command Center (compiles on ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web/src-tauri
      # the UI is not needed to compile the Rust side; an empty dist satisfies tauri's build script
      - name: cargo check
        working-directory: web/src-tauri
        run: |
          mkdir -p ../dist/esp-frontend
          echo '<!doctype html>' > ../dist/esp-frontend/index.html
          cargo check --locked

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [firmware, app-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Firmware archive
        run: |
          cd artifacts/firmware
          zip ../DeepDeck-firmware-${GITHUB_REF_NAME}.zip *
          cp DeepDeck.bin ../DeepDeck-${GITHUB_REF_NAME}.bin
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/command-center-windows/*.exe
            artifacts/DeepDeck-*.bin
            artifacts/DeepDeck-firmware-*.zip
